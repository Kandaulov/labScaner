name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Сборка и тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Последние версии пакетов (информационно)
        continue-on-error: true
        run: python3 .github/scripts/latest-versions.py

      - name: Восстановление пакетов
        run: .github/scripts/run.sh dotnet restore LabScaner.slnx

      - name: Сборка (предупреждения = ошибки)
        run: .github/scripts/run.sh dotnet build LabScaner.slnx --no-restore -c Release

      - name: Тесты
        run: .github/scripts/run.sh dotnet test LabScaner.slnx --no-build -c Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Форматирование
        run: .github/scripts/run.sh dotnet format LabScaner.slnx --verify-no-changes --no-restore

      - name: Сводка тестов
        if: always()
        run: |
          for f in TestResults/*.trx; do
            [ -f "$f" ] || continue
            c=$(grep -o '<Counters [^>]*>' "$f" | head -1)
            echo "::notice title=Тесты $(basename "$f" .trx)::$c"
          done
          # Упавшие тесты — целиком: сообщение и строка теста, где сработала проверка.
          python3 - <<'PY'
          import glob, html, re
          for f in glob.glob("TestResults/*.trx"):
              s = open(f, encoding="utf-8").read()
              for m in re.finditer(r'<UnitTestResult [^>]*testName="([^"]+)"[^>]*outcome="Failed".*?</UnitTestResult>', s, re.S):
                  block = m.group(0)
                  msg = html.unescape((re.search(r"<Message>(.*?)</Message>", block, re.S) or [None, ""])[1])
                  trace = html.unescape((re.search(r"<StackTrace>(.*?)</StackTrace>", block, re.S) or [None, ""])[1])
                  where = [l.strip() for l in trace.splitlines() if "/tests/" in l][:2]
                  text = (msg[:1500] + "\n" + "\n".join(where)).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={html.unescape(m.group(1))[-120:]}::{text}")
          PY

      - name: Результаты тестов
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  docker:
    name: Docker Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Настройки .env
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 16)/; s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^HTTP_PORT=.*/HTTP_PORT=8081/; s/^HTTPS_PORT=.*/HTTPS_PORT=8443/; s#^APP_IMAGE=.*#APP_IMAGE=labscaner:ci#" .env

      - name: Сборка и запуск
        working-directory: deploy
        run: ../.github/scripts/run.sh docker compose up -d --build --wait --wait-timeout 180

      - name: Проверка через Caddy (HTTPS)
        run: |
          curl -kfsS https://localhost:8443/health | grep -q Healthy
          curl -kfsS https://localhost:8443/Account/Login | grep -q "Вход"
          curl -kfsSI https://localhost:8443/css/site.css | grep -qi "content-type: text/css"
          curl -kfsS -H "Accept-Encoding: gzip" -o /dev/null -w "%{size_download}" https://localhost:8443/Account/Login
          echo "::notice title=Docker Compose::приложение отвечает через Caddy по HTTPS"

      - name: Журналы контейнеров
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color | grep -iE "fail|error|exception|crit" | head -40 | sed 's/^/::error::/' || true

      - name: Остановка
        if: always()
        working-directory: deploy
        run: docker compose down -v
