name: Снимки экранов

# Поднимает приложение с пустой БД и снимает экраны (компьютер 1440×900 и телефон 390×844).
# Снимки кладутся в ветку ci-screenshots, папка = имя ветки.
on:
  push:
    branches: ["feature/**"]
    paths: ["src/LabScaner.Web/**", ".github/workflows/screenshots.yml", ".github/scripts/screenshots.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Снимки экранов
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: PostgreSQL
        run: |
          docker run -d --name db -p 5432:5432 -e POSTGRES_USER=labscaner -e POSTGRES_PASSWORD=labscaner-ci -e POSTGRES_DB=labscaner postgres:17-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U labscaner && break; sleep 1; done

      - name: Сборка
        run: .github/scripts/run.sh dotnet publish src/LabScaner.Web -c Release -o publish

      - name: Запуск приложения
        env:
          ConnectionStrings__Default: Host=localhost;Database=labscaner;Username=labscaner;Password=labscaner-ci
          Bootstrap__AdminLogin: admin
          Bootstrap__AdminPassword: screenshots-password
          DataProtection__KeysPath: /tmp/labscaner-keys
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          export Bootstrap__AdminDisplayName="$(printf 'Кандаулов В. М.')"
          nohup dotnet publish/LabScaner.Web.dll > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5080/health && exit 0
            sleep 1
          done
          sed 's/^/::error::/' app.log | tail -40
          exit 1

      - name: Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Снимки
        env:
          SHOT_LOGIN: admin
          SHOT_PASSWORD: screenshots-password
        run: .github/scripts/run.sh python .github/scripts/screenshots.py http://127.0.0.1:5080 shots

      - name: Ошибки приложения
        if: always()
        run: grep -A3 -E "fail:|crit:" app.log | head -40 | sed 's/^/::warning::/' || true

      - name: Публикация в ветку ci-screenshots
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          dir="${BRANCH//\//-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-screenshots:ci-screenshots 2>/dev/null || true
          git worktree add --force ../shots-wt ci-screenshots 2>/dev/null || {
            git worktree add --detach ../shots-wt && cd ../shots-wt && git checkout --orphan ci-screenshots && git rm -rfq . && cd -; }
          rm -rf "../shots-wt/$dir" && mkdir -p "../shots-wt/$dir" && cp -r shots/* "../shots-wt/$dir/"
          cd ../shots-wt
          git add -A
          git commit -qm "Снимки экранов: $BRANCH @ ${GITHUB_SHA::7}" || exit 0
          git push -q origin ci-screenshots
          echo "::notice title=Снимки экранов::ветка ci-screenshots, папка $dir"
