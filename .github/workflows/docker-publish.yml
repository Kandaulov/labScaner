name: Образ в GHCR

# Каждое изменение main публикует образ приложения:
#   ghcr.io/kandaulov/labscaner:main и :sha-<коммит>; тег vX.Y.Z — ещё и :X.Y.Z и :latest.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["deploy/Dockerfile", ".github/workflows/docker-publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Сборка и публикация образа
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kandaulov/labscaner
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Сборка обычной командой, чтобы ошибки компиляции попадали в аннотации (run.sh).
      - name: Сборка и публикация
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$TAGS"
          while IFS= read -r l; do [ -n "$l" ] && args+=(--label "$l"); done <<< "$LABELS"
          [ "$PUSH" = "true" ] && args+=(--push)
          # Версия должна быть корректной SemVer: v1.2.3 → 1.2.3, иначе 0.0.0-<ветка>.<коммит>
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"
          else version="0.0.0-$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9\n' '-').${GITHUB_SHA::7}"; fi
          .github/scripts/run.sh docker buildx build --progress=plain -f deploy/Dockerfile \
            --build-arg "VERSION=$version" "${args[@]}" .
